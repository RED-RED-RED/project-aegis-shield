# ARGUS: nRF52840 hci_usb tuned for passive Remote ID scanning
# Extended advertising (needed for BT5 Long Range / Coded PHY scanning)
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y
# Room for full BT5 Remote ID message packs and chained adverts
CONFIG_BT_CTLR_SCAN_DATA_LEN_MAX=1650
# Allow more than one interleaved BT5 chain (several drones at once)
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_SCAN_AUX_SET=4
# Larger and more HCI event buffers so busy airspace doesn't drop reports
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_CTLR_RX_BUFFERS=9
